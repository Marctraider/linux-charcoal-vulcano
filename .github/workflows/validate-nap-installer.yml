name: Validate SteamOS 3.10 Charcoal Linux 7.3 installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-nap-installer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Validate installer syntax and regression tests
        run: |
          set -Eeuo pipefail
          bash -n install-charcoal.sh
          bash -n linux-charcoal-73.install
          bash tests/test-install-charcoal.sh
