name: Validate SteamOS 3.10 NAP governor port

on:
  push:
    branches:
      - experiment/steamos-3.10-linux-7.3-nap
    paths:
      - 'PKGBUILD'
      - 'config-charcoal'
      - 'nap-6.12-v0.6.5.patch'
      - 'automation/fix-nap-kernel-api.py'
      - 'tests/test_nap_kernel_api.py'
      - '.github/workflows/validate-nap-port-7.3.yml'

permissions:
  contents: read

jobs:
  validate-nap-port:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/steamos-3.10-linux-7.3-nap
      - name: Validate PKGBUILD syntax and pinned patch
        run: |
          set -Eeuo pipefail
          bash -n PKGBUILD
          echo '4d4ac50ba014de33638a2efe9c6adc507b888c6d090aa29ea17b2a4686de4e07  nap-6.12-v0.6.5.patch' | sha256sum --check
          grep -q '^CONFIG_CPU_IDLE=y$' config-charcoal
          grep -q '^CONFIG_CPU_IDLE_GOV_NAP=y$' config-charcoal
          grep -q "'CONFIG_CPU_IDLE_GOV_NAP=y'" PKGBUILD
      - name: Test fail-closed NAP Linux API adaptation
        run: |
          set -Eeuo pipefail
          python3 -m py_compile automation/fix-nap-kernel-api.py tests/test_nap_kernel_api.py
          python3 tests/test_nap_kernel_api.py
      - name: Check patch application against upstream Linux 7.3 sources
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --depth=1 --branch v7.3 https://github.com/torvalds/linux.git "$RUNNER_TEMP/linux-7.3"
          git -C "$RUNNER_TEMP/linux-7.3" sparse-checkout set drivers/cpuidle include/linux/cpuidle.h include/linux/sysfs.h include/linux/kernel_stat.h arch/x86/include/asm/hardirq.h
          git -C "$RUNNER_TEMP/linux-7.3" apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/nap-6.12-v0.6.5.patch"
          git -C "$RUNNER_TEMP/linux-7.3" apply --whitespace=nowarn "$GITHUB_WORKSPACE/nap-6.12-v0.6.5.patch"
          python3 automation/fix-nap-kernel-api.py "$RUNNER_TEMP/linux-7.3/drivers/cpuidle/governors/nap/nap.c"
          grep -q 'config CPU_IDLE_GOV_NAP' "$RUNNER_TEMP/linux-7.3/drivers/cpuidle/Kconfig"
          grep -q 'poll_limit_ns' "$RUNNER_TEMP/linux-7.3/include/linux/cpuidle.h"
          grep -q 'last_residency_ns' "$RUNNER_TEMP/linux-7.3/include/linux/cpuidle.h"
          grep -q 'target_residency_ns' "$RUNNER_TEMP/linux-7.3/include/linux/cpuidle.h"
          grep -q 'exit_latency_ns' "$RUNNER_TEMP/linux-7.3/include/linux/cpuidle.h"
          grep -q 'cpuidle_governor_latency_req' "$RUNNER_TEMP/linux-7.3/include/linux/cpuidle.h"
          grep -q 'IRQ_COUNT_APIC_TIMER' "$RUNNER_TEMP/linux-7.3/arch/x86/include/asm/hardirq.h"
          grep -q 'counts\[NR_IRQ_COUNTS\]' "$RUNNER_TEMP/linux-7.3/arch/x86/include/asm/hardirq.h"
          grep -q 'irqs_sum' "$RUNNER_TEMP/linux-7.3/include/linux/kernel_stat.h"
          grep -q 'const struct bin_attribute \*attr' "$RUNNER_TEMP/linux-7.3/include/linux/sysfs.h"
          grep -q 'const struct bin_attribute.*bin_attrs' "$RUNNER_TEMP/linux-7.3/include/linux/sysfs.h"
      - name: Check availability of the pinned Valve source archive
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --head \
            https://steamdeck-packages.steamos.cloud/archlinux-mirror/sources/jupiter-3.10/linux-neptune-73-7.3.1.valve2-1.src.tar.gz \
            | tee "$RUNNER_TEMP/valve-source-headers.txt"
          grep -qi '^HTTP/.* 200' "$RUNNER_TEMP/valve-source-headers.txt"
          grep -qi '^content-length:' "$RUNNER_TEMP/valve-source-headers.txt"
