name: Inspect Valve SteamOS 3.10 Linux 7.3 source

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charcoal-73-source-inspection
  cancel-in-progress: false

jobs:
  inspect-valve-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Charcoal
        uses: actions/checkout@v4
        with:
          ref: validation/steamos-3.10-linux-7.3
          fetch-depth: 1

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 tar zstd

      - name: Download and verify Valve source archive
        run: |
          set -Eeuo pipefail
          url="https://steamdeck-packages.steamos.cloud/archlinux-mirror/sources/jupiter-3.10/linux-neptune-73-7.3.1.valve2-1.src.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --output valve-source.tar.gz "$url"
          sha256sum valve-source.tar.gz | tee valve-source.sha256
          du -h valve-source.tar.gz | tee valve-source-size.txt

      - name: Extract Valve package metadata and embedded source in one archive pass
        run: |
          set -Eeuo pipefail
          mkdir -p valve-package
          tar -xzf valve-source.tar.gz -C valve-package \
            linux-neptune-73/PKGBUILD \
            linux-neptune-73/config-neptune \
            linux-neptune-73/config.x86_64 \
            linux-neptune-73/archlinux-linux-neptune
          find valve-package/linux-neptune-73 -maxdepth 2 -type f ! -path '*/archlinux-linux-neptune/objects/*' -printf '%P\n' | sort > archive-file-list.txt
          cp valve-package/linux-neptune-73/PKGBUILD valve-PKGBUILD.txt
          cp valve-package/linux-neptune-73/archlinux-linux-neptune/config valve-config.txt
          cp valve-package/linux-neptune-73/config-neptune valve-config-neptune.txt
          cp valve-package/linux-neptune-73/config.x86_64 valve-config-x86_64.txt
          printf '%s\n' 'linux-neptune-73/PKGBUILD' 'linux-neptune-73/config' 'linux-neptune-73/config-neptune' 'linux-neptune-73/config.x86_64' 'linux-neptune-73/archlinux-linux-neptune' > source-layout.txt
          du -sh valve-package/linux-neptune-73/archlinux-linux-neptune | tee valve-embedded-git-size.txt
          df -h "$RUNNER_TEMP" | tee valve-runner-disk-after-extraction.txt

      - name: Inspect Valve's embedded source Git repository
        run: |
          set -Eeuo pipefail
          repo_dir="$GITHUB_WORKSPACE/valve-package/linux-neptune-73/archlinux-linux-neptune"
          test -d "$repo_dir"
          git --git-dir="$repo_dir" rev-parse --is-bare-repository
          git --git-dir="$repo_dir" show-ref | tee valve-git-refs.txt
          git --git-dir="$repo_dir" cat-file -t refs/tags/7.3.1-valve2 | tee valve-tag-object-type.txt
          git --git-dir="$repo_dir" rev-parse 'refs/tags/7.3.1-valve2^{commit}' | tee valve-source-commit.txt
          git --git-dir="$repo_dir" show -s --format=fuller 'refs/tags/7.3.1-valve2^{commit}' | tee valve-source-commit-details.txt
          git --git-dir="$repo_dir" count-objects -v | tee valve-git-object-stats.txt

      - name: Check out the exact Valve 7.3.1-valve2 source tree
        run: |
          set -Eeuo pipefail
          repo_dir="$GITHUB_WORKSPACE/valve-package/linux-neptune-73/archlinux-linux-neptune"
          tree_dir="$RUNNER_TEMP/valve-linux-integration"
          commit="$(cat valve-source-commit.txt)"
          df -h "$RUNNER_TEMP" | tee valve-runner-disk-before-checkout.txt
          git --git-dir="$repo_dir" worktree add --detach "$tree_dir" "$commit"
          test "$(git -C "$tree_dir" rev-parse HEAD)" = "$commit"
          printf '%s\n' "$tree_dir" > valve-source-tree-path.txt
          git -C "$tree_dir" status --short --branch | tee valve-source-tree-status.txt
          git -C "$tree_dir" log -1 --format=fuller | tee valve-source-tree-commit.txt
          df -h "$RUNNER_TEMP" | tee valve-runner-disk-after-checkout.txt

      - name: Audit Valve source layout and required base configuration
        run: |
          set -Eeuo pipefail
          tree_dir="$RUNNER_TEMP/valve-linux-integration"
          python3 - "$tree_dir" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          required = [
              "CONFIG_BTRFS_FS", "CONFIG_HID_STEAM", "CONFIG_MFD_STEAMDECK",
              "CONFIG_LEDS_STEAMDECK", "CONFIG_SENSORS_STEAMDECK",
              "CONFIG_X86_AMD_PSTATE", "CONFIG_ZRAM", "CONFIG_ZSWAP",
              "CONFIG_LRU_CAST", "CONFIG_SCHED_BORE", "CONFIG_SCHED_POC_SELECTOR",
              "CONFIG_CPU_IDLE_GOV_NAP", "CONFIG_ZEN_INTERACTIVE",
              "CONFIG_LTO_CLANG_FULL", "CONFIG_POLLY_CLANG",
          ]
          files = [
              ("source/config", root / "config"),
              ("package/config-neptune", Path("valve-package/linux-neptune-73/config-neptune")),
              ("package/config.x86_64", Path("valve-package/linux-neptune-73/config.x86_64")),
          ]
          out = []
          for key in required:
              found = []
              for label, path in files:
                  if path.is_file():
                      for line in path.read_text(errors="replace").splitlines():
                          if line.startswith(key + "=") or line == "# " + key + " is not set":
                              found.append(f"{label}: {line}")
              out.append(f"{key}: " + (" | ".join(found) if found else "NOT PRESENT IN BASE FRAGMENTS"))
          Path("valve-config-feature-audit.txt").write_text("\n".join(out) + "\n")
          print("\n".join(out))
          candidates = [
              "block/elevator.c", "kernel/sched/fair.c", "kernel/sched/core.c",
              "kernel/sched/sched.h", "mm/folio.c", "mm/vmscan.c",
              "drivers/block/zram/zram_drv.c", "drivers/block/zram/zcomp.c",
              "drivers/cpufreq/amd-pstate.c", "drivers/cpuidle/governors/Makefile",
              "scripts/setlocalversion", "include/linux/sched.h"
          ]
          missing = [name for name in candidates if not (root / name).is_file()]
          Path("valve-source-path-audit.txt").write_text("\n".join(
              f"{name}: {'present' if (root/name).is_file() else 'MISSING'}" for name in candidates
          ) + "\n")
          if missing:
              raise SystemExit("Required source path(s) missing: " + ", ".join(missing))
          PY
          git -C "$tree_dir" grep -n -E 'CONFIG_(SCHED_BORE|SCHED_POC_SELECTOR|LRU_CAST|CPU_IDLE_GOV_NAP)' -- '*Kconfig*' 'kernel/sched/*' > valve-scheduler-symbol-locations.txt || true

      - name: Audit pinned Linux 7.3 scheduler and memory patch candidates
        run: |
          set -Eeuo pipefail
          tree_dir="$RUNNER_TEMP/valve-linux-integration"
          mkdir -p patch-candidates
          python3 - <<'PY' > patch-candidate-list.tsv
          import json
          from pathlib import Path
          data = json.loads(Path("automation/patch-candidates-7.3.json").read_text())
          for item in data["patches"]:
              fields = [item.get(key, "") for key in (
                  "name", "repository", "commit", "path", "blob",
                  "local_path", "url", "expected_commit"
              )]
              print("|".join(fields))
          PY
          : > valve-patch-apply-audit.txt
          : > valve-patch-candidate-hashes.txt
          while IFS='|' read -r name repository commit patch_path blob local_path url expected_commit; do
            file="patch-candidates/$name.patch"
            if [ -n "$local_path" ]; then
              echo "[$name] using local pinned file $local_path" | tee -a valve-patch-apply-audit.txt
              cp "$GITHUB_WORKSPACE/$local_path" "$file"
            else
              if [ -z "$url" ]; then
                url="https://raw.githubusercontent.com/$repository/$commit/$patch_path"
              fi
              echo "[$name] fetching $url" | tee -a valve-patch-apply-audit.txt
              if ! curl --fail --location --retry 3 --retry-all-errors --output "$file" "$url"; then
                echo "[$name] FETCH_FAILED" | tee -a valve-patch-apply-audit.txt
                continue
              fi
            fi
            actual_blob="$(git hash-object "$file")"
            actual_sha256="$(sha256sum "$file" | awk '{print $1}')"
            echo "$name blob=$actual_blob sha256=$actual_sha256" | tee -a valve-patch-candidate-hashes.txt
            if [ -n "$blob" ] && [ "$actual_blob" != "$blob" ]; then
              echo "[$name] BLOB_MISMATCH expected=$blob actual=$actual_blob" | tee -a valve-patch-apply-audit.txt
              continue
            fi
            if [ -n "$expected_commit" ] && ! head -n 1 "$file" | grep -Fq "From $expected_commit "; then
              echo "[$name] COMMIT_HEADER_MISMATCH expected=$expected_commit" | tee -a valve-patch-apply-audit.txt
              continue
            fi
            if git -C "$tree_dir" apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$file" 2>"$file.check.log"; then
              if git -C "$tree_dir" apply --whitespace=nowarn "$GITHUB_WORKSPACE/$file"; then
                echo "[$name] APPLIED_SEQUENTIALLY blob=$actual_blob sha256=$actual_sha256" | tee -a valve-patch-apply-audit.txt
              else
                echo "[$name] APPLY_FAILED_AFTER_CHECK" | tee -a valve-patch-apply-audit.txt
              fi
            else
              echo "[$name] DOES_NOT_APPLY_AFTER_PREVIOUS_SUCCESSFUL_CANDIDATES" | tee -a valve-patch-apply-audit.txt
              sed -n '1,100p' "$file.check.log" | tee -a valve-patch-apply-audit.txt
            fi
          done < patch-candidate-list.tsv
          {
            echo "Van Gogh power-limit function context (after the 4.2 GHz patch):"
            sed -n '2315,2375p' "$tree_dir/drivers/gpu/drm/amd/pm/swsmu/smu11/vangogh_ppt.c"
          } > valve-vangogh-power-source.txt
          {
            echo "AMD/Intel P-State Kconfig blocks before Zen helper:"
            grep -n -A28 "config X86_INTEL_PSTATE" "$tree_dir/drivers/cpufreq/Kconfig.x86" || true
            grep -n -A28 "config X86_AMD_PSTATE" "$tree_dir/drivers/cpufreq/Kconfig.x86" || true
          } > valve-zen-kconfig-audit.txt
          if python3 "$GITHUB_WORKSPACE/automation/configure-zen-interactive.py" "$tree_dir" > valve-zen-helper-audit.txt 2>&1; then
            echo "ZEN_INTERACTIVE_HELPER=PASS" >> valve-zen-helper-audit.txt
          else
            echo "ZEN_INTERACTIVE_HELPER=FAIL" >> valve-zen-helper-audit.txt
          fi
          else
          fi
          if python3 "$GITHUB_WORKSPACE/automation/fix-gud-tv-mode-fortify.py" "$tree_dir/drivers/gpu/drm/gud/gud_connector.c" > valve-gud-helper-audit.txt 2>&1; then
            echo "GUD_FORTIFY_HELPER=PASS" >> valve-gud-helper-audit.txt
          else
            echo "GUD_FORTIFY_HELPER=FAIL" >> valve-gud-helper-audit.txt
          fi
          {
            echo "amd-pstate.h before manual EPP port:"
            sed -n "1,230p" "$tree_dir/drivers/cpufreq/amd-pstate.h"
          } > valve-amd-pstate-header.txt
          {
            echo "amd-pstate.c relevant functions before EPP core reject test:"
            grep -n -A45 "static int msr_update_perf" "$tree_dir/drivers/cpufreq/amd-pstate.c" || true
            grep -n -A55 "static int msr_set_epp" "$tree_dir/drivers/cpufreq/amd-pstate.c" || true
            grep -n -A220 "static bool amd_pstate_acpi_pm_profile_undefined" "$tree_dir/drivers/cpufreq/amd-pstate.c" || true
            grep -n -A90 "static int amd_pstate_epp_cpu_init" "$tree_dir/drivers/cpufreq/amd-pstate.c" || true
            grep -n -A70 "static int amd_pstate_epp_resume" "$tree_dir/drivers/cpufreq/amd-pstate.c" || true
          } > valve-amd-pstate-source.txt
          sed -n "350,430p" "$tree_dir/Documentation/admin-guide/pm/amd-pstate.rst" > valve-amd-pstate-doc-source.txt
          if git -C "$tree_dir" apply --reject --whitespace=nowarn "$GITHUB_WORKSPACE/patch-candidates/amd_pstate_epp_03_core.patch" > valve-amd-pstate-reject-audit.txt 2>&1; then
            echo "EPP_CORE_REJECT_TEST=APPLIED" >> valve-amd-pstate-reject-audit.txt
          else
            echo "EPP_CORE_REJECT_TEST=PARTIAL_OR_REJECTED" >> valve-amd-pstate-reject-audit.txt
          fi
          find "$tree_dir" -name "*.rej" -type f -print -exec cat {} \; > valve-amd-pstate-rejects.txt || true
          git -C "$tree_dir" diff --check > valve-patch-whitespace-audit.txt 2>&1 || true
          {
            echo "Scheduler reweight_task symbols:"
            grep -R -n "reweight_task" "$tree_dir/kernel/sched" "$tree_dir/include/linux/sched" 2>/dev/null || true
            echo
            echo "Scheduler initialization symbol:"
            grep -n -A40 "init_sched_fair_class" "$tree_dir/kernel/sched/fair.c" || true
          } > valve-sched-ext-audit.txt
          git -C "$tree_dir" diff --stat | tee valve-patch-applied-diff-stat.txt
          git -C "$tree_dir" status --short | tee valve-patch-applied-status.txt

      - name: Upload Valve source inspection
        uses: actions/upload-artifact@v4
        with:
          name: valve-steamos-3.10-linux-7.3.1-valve2-source-inspection
          path: |
            valve-source.sha256
            valve-source-size.txt
            archive-file-list.txt
            source-layout.txt
            valve-PKGBUILD.txt
            valve-config.txt
            valve-config-neptune.txt
            valve-config-x86_64.txt
            valve-embedded-git-size.txt
            valve-runner-disk-after-extraction.txt
            valve-git-refs.txt
            valve-tag-object-type.txt
            valve-source-commit.txt
            valve-source-commit-details.txt
            valve-git-object-stats.txt
            valve-runner-disk-before-checkout.txt
            valve-runner-disk-after-checkout.txt
            valve-source-tree-path.txt
            valve-source-tree-status.txt
            valve-source-tree-commit.txt
            valve-config-feature-audit.txt
            valve-source-path-audit.txt
            valve-scheduler-symbol-locations.txt
            valve-patch-apply-audit.txt
            valve-patch-candidate-hashes.txt
            valve-sched-ext-audit.txt
            valve-vangogh-power-source.txt
            valve-amd-pstate-header.txt
            valve-amd-pstate-source.txt
            valve-amd-pstate-doc-source.txt
            valve-amd-pstate-reject-audit.txt
            valve-amd-pstate-rejects.txt
            valve-zen-kconfig-audit.txt
            valve-zen-helper-audit.txt
            valve-gud-helper-audit.txt
            valve-patch-whitespace-audit.txt
            valve-patch-applied-diff-stat.txt
            valve-patch-applied-status.txt
            patch-candidate-list.tsv
            patch-candidates/
          if-no-files-found: error
          retention-days: 7



