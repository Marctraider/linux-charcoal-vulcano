name: Inspect Valve SteamOS 3.10 Linux 7.3 source

on:
  push:
    branches:
      - validation/steamos-3.10-linux-7.3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: charcoal-73-source-inspection
  cancel-in-progress: false

jobs:
  inspect-valve-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out Charcoal
        uses: actions/checkout@v4
        with:
          ref: validation/steamos-3.10-linux-7.3
          fetch-depth: 1

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 tar zstd

      - name: Download and verify Valve source archive
        run: |
          set -Eeuo pipefail
          url="https://steamdeck-packages.steamos.cloud/archlinux-mirror/sources/jupiter-3.10/linux-neptune-73-7.3.1.valve2-1.src.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --output valve-source.tar.gz "$url"
          sha256sum valve-source.tar.gz | tee valve-source.sha256
          du -h valve-source.tar.gz | tee valve-source-size.txt

      - name: Extract compact Valve packaging metadata and configs
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          archive = "valve-source.tar.gz"
          names = subprocess.check_output(["tar", "-tzf", archive], text=True).splitlines()
          Path("archive-file-list.txt").write_text("\n".join(names) + "\n")
          pkgbuilds = [n for n in names if n.endswith("/PKGBUILD") or n == "PKGBUILD"]
          configs = [n for n in names if n.rsplit("/", 1)[-1] in {
              "config", "config-neptune", "config.x86_64", "config-neptune.x86_64"
          }]
          selected = []
          for name in pkgbuilds[:5] + configs[:20]:
              out = subprocess.check_output(["tar", "-xOzf", archive, name])
              target = Path("valve-metadata") / name.replace("/", "__")
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(out)
              selected.append({"archive_path": name, "saved_as": str(target), "bytes": len(out)})
          assert pkgbuilds, "No PKGBUILD found in Valve source archive"
          Path("source-layout.txt").write_text("\n".join(
              n for n in names if "archlinux-linux-neptune" in n or n.endswith("/PKGBUILD")
          ) + "\n")
          Path("valve-source-metadata.json").write_text(json.dumps({
              "pkgbuild_paths": pkgbuilds[:20],
              "config_paths": configs[:50],
              "extracted_files": selected,
              "archive_member_count": len(names),
          }, indent=2) + "\n")
          print(json.dumps({
              "archive_member_count": len(names),
              "pkgbuild_paths": pkgbuilds[:20],
              "config_paths": configs[:50],
              "extracted_files": selected,
          }, indent=2))
          PY

      - name: Inspect Valve's embedded source Git repository
        run: |
          set -Eeuo pipefail
          repo_dir="$RUNNER_TEMP/valve-linux-integration.git"
          mkdir -p "$repo_dir"
          tar -xzf valve-source.tar.gz -C "$repo_dir" --strip-components=2 linux-neptune-73/archlinux-linux-neptune
          git --git-dir="$repo_dir" rev-parse --is-bare-repository
          git --git-dir="$repo_dir" show-ref | tee valve-git-refs.txt
          git --git-dir="$repo_dir" cat-file -t refs/tags/7.3.1-valve2 | tee valve-tag-object-type.txt
          git --git-dir="$repo_dir" rev-parse 'refs/tags/7.3.1-valve2^{commit}' | tee valve-source-commit.txt
          git --git-dir="$repo_dir" show -s --format=fuller 'refs/tags/7.3.1-valve2^{commit}' | tee valve-source-commit-details.txt
          git --git-dir="$repo_dir" count-objects -v | tee valve-git-object-stats.txt

      - name: Upload Valve source inspection
        uses: actions/upload-artifact@v4
        with:
          name: valve-steamos-3.10-linux-7.3.1-valve2-source-inspection
          path: |
            valve-source.sha256
            valve-source-size.txt
            archive-file-list.txt
            source-layout.txt
            valve-metadata/
            valve-source-metadata.json
            valve-git-refs.txt
            valve-tag-object-type.txt
            valve-source-commit.txt
            valve-source-commit-details.txt
            valve-git-object-stats.txt
          if-no-files-found: error
          retention-days: 7
