name: Validate SteamOS 3.10 Charcoal Linux 7.3 installer

on:
  push:
    branches:
      - validation/steamos-3.10-linux-7.3
    paths:
      - 'install-charcoal.sh'
      - 'tests/test-install-charcoal.sh'

permissions:
  contents: read

jobs:
  validate-installer:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out 7.3 validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/steamos-3.10-linux-7.3
      - name: Validate installer syntax and regression tests
        run: |
          set -Eeuo pipefail
          bash -n install-charcoal.sh
          bash tests/test-install-charcoal.sh
